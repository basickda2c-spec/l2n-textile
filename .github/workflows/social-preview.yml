name: Generate social preview image
on:
  workflow_dispatch:
  push:
    paths:
      - 'l2n-social.png'
      - '.github/workflows/social-preview.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Generate 1200x630 preview
        run: |
          python - <<'PY'
          from PIL import Image
          logo=Image.open("l2n-social.png").convert("RGBA")
          canvas=Image.new("RGBA",(1200,630),(24,24,24,255))
          logo.thumbnail((900,340),Image.Resampling.LANCZOS)
          canvas.alpha_composite(logo,((1200-logo.width)//2,(630-logo.height)//2))
          canvas.convert("RGB").save("og-preview.png",optimize=True)
          PY
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-preview.png
          git diff --cached --quiet || (git commit -m "Generate social preview 1200x630" && git push)
